name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.3.3

      - name: Find project folder
        id: p
        run: |
          F=$(find . -name settings.gradle -not -path "./.git/*" | head -n 1)
          if [ -z "$F" ]; then echo "settings.gradle not found"; exit 1; fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Build mod
        run: gradle build --no-daemon -p "${{ steps.p.outputs.dir }}"

      - uses: actions/upload-artifact@v4
        with:
          name: rustak-ak47
          path: ${{ steps.p.outputs.dir }}/build/libs/*.jar
